<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f0fdf4;
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar {
            background: linear-gradient(to right, #16a34a, #22c55e);
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .card {
            border-radius: 12px;
        }
        .card-icon {
            font-size: 2rem;
            padding: 10px;
            border-radius: 10px;
        }
        .bg-light-green {
            background-color: #dcfce7;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">Etrend Dashboard</a>
        <div class="d-flex">
            <a class="btn btn-outline-light" href="{% url 'logout' %}">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>
</nav>

<!-- Main Container -->
<div class="container mt-5">

    <!-- Welcome Header -->
    <div class="row mb-4">
        <div class="col-md-12 text-center">
            <h3>Welcome, <strong>{{ user.username }}</strong></h3>
            <p class="text-muted">Your dashboard overview</p>
        </div>
    </div>

    <!-- Profile Summary -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card bg-light-green">
                <div class="card-body text-center">
                    <i class="bi bi-person-fill card-icon text-success"></i>
                    <h5 class="card-title mt-2">Username</h5>
                    <p class="card-text">{{ user.username }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-light-green">
                <div class="card-body text-center">
                    <i class="bi bi-envelope-fill card-icon text-primary"></i>
                    <h5 class="card-title mt-2">Email</h5>
                    <p class="card-text">{{ user.email|default:"Not Provided" }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-light-green">
                <div class="card-body text-center">
                    <i class="bi bi-calendar-check-fill card-icon text-warning"></i>
                    <h5 class="card-title mt-2">Joined</h5>
                    <p class="card-text">{{ user.date_joined|date:"F j, Y" }}</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats Summary -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-bag-check-fill text-primary card-icon"></i>
                    <h5 class="card-title">Orders</h5>
                    <p class="card-text">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-chat-left-dots-fill text-success card-icon"></i>
                    <h5 class="card-title">Messages</h5>
                    <p class="card-text">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-bell-fill text-warning card-icon"></i>
                    <h5 class="card-title">Notifications</h5>
                    <p class="card-text">0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Token Info -->
    <div class="row">
        <div class="col-md-12 text-center">
            <p class="text-muted">Your Token: <code>{{ token.key }}</code></p>
        </div>
    </div>

</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
